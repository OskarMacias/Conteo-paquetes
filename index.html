<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Entrega de Paquetes</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 30px;
      width: 100%;
      max-width: 450px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary-color);
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
      background-color: #fafafa;
    }

    .user-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .counter-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background-color: #e2e8f0;
      border: none;
      color: #334155;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #cbd5e1;
    }

    input[type="number"] {
      width: 60px;
      padding: 6px;
      text-align: center;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .total-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      font-weight: bold;
      font-size: 1.1rem;
      color: #1e40af;
    }

    .total-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .btn-reset {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-reset:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📦 Control de Paquetes</h1>

    <div class="user-card">
      <span class="user-name">Oskar Macías</span>
      <div class="counter-controls">
        <button class="btn" onclick="adjustValue('oskar', -1)">-</button>
        <input type="number" id="oskar" value="0" min="0" oninput="calculateTotal()">
        <button class="btn" onclick="adjustValue('oskar', 1)">+</button>
      </div>
    </div>

    <div class="user-card">
      <span class="user-name">Damaris Vega</span>
      <div class="counter-controls">
        <button class="btn" onclick="adjustValue('damaris', -1)">-</button>
        <input type="number" id="damaris" value="0" min="0" oninput="calculateTotal()">
        <button class="btn" onclick="adjustValue('damaris', 1)">+</button>
      </div>
    </div>

    <div class="user-card">
      <span class="user-name">Zahory Garcia</span>
      <div class="counter-controls">
        <button class="btn" onclick="adjustValue('zahory', -1)">-</button>
        <input type="number" id="zahory" value="0" min="0" oninput="calculateTotal()">
        <button class="btn" onclick="adjustValue('zahory', 1)">+</button>
      </div>
    </div>

    <div class="user-card">
      <span class="user-name">Isabel Villa</span>
      <div class="counter-controls">
        <button class="btn" onclick="adjustValue('isabel', -1)">-</button>
        <input type="number" id="isabel" value="0" min="0" oninput="calculateTotal()">
        <button class="btn" onclick="adjustValue('isabel', 1)">+</button>
      </div>
    </div>

    <div class="total-box">
      <span class="total-label">Total Entregados:</span>
      <span class="total-value" id="total">0</span>
    </div>

    <button class="btn-reset" onclick="resetCounters()">Reiniciar Conteo</button>
  </div>

  <script>
    const users = ['oskar', 'damaris', 'zahory', 'isabel'];

    function calculateTotal() {
      let total = 0;
      users.forEach(user => {
        const input = document.getElementById(user);
        let val = parseInt(input.value) || 0;
        if (val < 0) {
          val = 0;
          input.value = 0;
        }
        total += val;
      });
      document.getElementById('total').innerText = total;
    }

    function adjustValue(userId, change) {
      const input = document.getElementById(userId);
      let currentValue = parseInt(input.value) || 0;
      currentValue += change;
      if (currentValue < 0) currentValue = 0;
      input.value = currentValue;
      calculateTotal();
    }

    function resetCounters() {
      if (confirm('¿Deseas reiniciar todos los contadores a cero?')) {
        users.forEach(user => {
          document.getElementById(user).value = 0;
        });
        calculateTotal();
      }
    }
  </script>

</body>
</html>
